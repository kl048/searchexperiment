{% block content %}
<h3>Job Search {{ player.round_number }} - Period <span id="period">1</span></h3>
<p>Wage offer: <span id="wage">-</span></p>
<p>Offer accepted: <span id="accepted">-</span></p>

<div class="table-container">
    <table id="history-table">
        <thead>
        <tr>
            <th>Period</th>
            <th>Offer</th>
            <th>Decision</th>
            <th>Continue</th>
        </tr>
        </thead>
        <tbody id="history-table-body">
        </tbody>
    </table>
</div>

<form method="post">
    <input type="hidden" name="wage_offer" value="" id="wage-offer-field">
    <input type="hidden" name="accepted" value="" id="accepted-field">
    <input type="hidden" name="wage_offer_history" value="" id="wage-offer-history-field">
    <input type="hidden" name="decision_history" value="" id="decision-history-field">
    <input type="hidden" name="continue_history" value="" id="continue-history-field">

    <button type="button" id="next-period" style="margin-top: 10px;">Next Period</button>
    <p id="message" style="color: green; display: none;">See the results from this search in the next page.</p>
    <button type="submit" id="next-episode" style="margin-top: 10px; display: none;">Next</button>
</form>

<script>
    function delayNextButton() {
        const nextButton = document.getElementById('next-episode');
        nextButton.disabled = true;
        let secondsLeft = 5;
        const originalText = nextButton.textContent;

        nextButton.textContent = `Please wait ${secondsLeft} seconds...`;

        const interval = setInterval(() => {
            secondsLeft--;
            if (secondsLeft > 0) {
                nextButton.textContent = `Please wait ${secondsLeft} seconds...`;
            } else {
                clearInterval(interval);
                nextButton.disabled = false;
                nextButton.textContent = originalText;
            }
        }, 1000);
    }

    function delayNextPeriodButton() {
        const periodButton = document.getElementById('next-period');
        periodButton.disabled = true;
        let secondsLeft = 5;
        const originalText = "Next Period";

        periodButton.textContent = `Wait ${secondsLeft}s...`;

        const interval = setInterval(() => {
            secondsLeft--;
            if (secondsLeft > 0) {
                periodButton.textContent = `Wait ${secondsLeft}s...`;
            } else {
                clearInterval(interval);
                periodButton.disabled = false;
                periodButton.textContent = originalText;
            }
        }, 1000);
    }

    const theta = parseInt("{{ C.THETA }}", 10);
    const reservationWage = parseInt("{{ player.reservation_wage }}", 10);
    const maxPeriodInEpisode = parseInt("{{ player.max_period_in_episode }}", 10);
    let period = 1;

    const wageOfferHistory = [];
    const decisionHistory = [];
    const continueHistory = [];

    document.getElementById('period').textContent = period;

    function determineWageOffer() {
        const wageOffer = Math.floor(Math.random() * theta) + 1;
        let decisionText, continueText;
        let accepted;

        if (wageOffer >= reservationWage) {
            accepted = true;
            decisionText = `Accept — because the offer of ${wageOffer} met or exceeded your reservation wage of ${reservationWage}.`;
            continueText = "No ";
        } else {
            accepted = false;
            decisionText = `Reject — because your reservation wage is ${reservationWage} and the offer was ${wageOffer}.`;
            continueText = (period >= maxPeriodInEpisode)
                ? "No "
                : "Yes ";
        }

        document.getElementById('wage').textContent = wageOffer;
        document.getElementById('accepted').textContent = accepted ? "Yes" : "No";

        wageOfferHistory.push({period: period, wageOffer: wageOffer});
        decisionHistory.push(decisionText);
        continueHistory.push(continueText);

        updateHistoryTable();

        if (accepted || period >= maxPeriodInEpisode) {
            endEpisode();
        } else {
            delayNextPeriodButton();
        }
    }

    function updateHistoryTable() {
        const tableBody = document.getElementById("history-table-body");
        tableBody.innerHTML = '';

        for (let i = 0; i < wageOfferHistory.length; i++) {
            const row = tableBody.insertRow();
            row.insertCell(0).textContent = wageOfferHistory[i].period;
            row.insertCell(1).textContent = wageOfferHistory[i].wageOffer;
            row.insertCell(2).textContent = decisionHistory[i];
            row.insertCell(3).textContent = continueHistory[i];
        }
    }

    function endEpisode() {
        document.getElementById('message').style.display = 'block';
        document.getElementById('next-episode').style.display = 'block';
        document.getElementById('next-period').style.display = 'none';

        const lastOffer = wageOfferHistory[wageOfferHistory.length - 1].wageOffer;
        const lastDecision = decisionHistory[decisionHistory.length - 1];

        document.getElementById('wage-offer-field').value = lastOffer;
        document.getElementById('accepted-field').value = lastDecision.startsWith("Accept");

        document.getElementById('wage-offer-history-field').value = JSON.stringify(wageOfferHistory);
        document.getElementById('decision-history-field').value = JSON.stringify(decisionHistory);
        document.getElementById('continue-history-field').value = JSON.stringify(continueHistory);

        delayNextButton();
    }

    determineWageOffer();

    document.getElementById('next-period').addEventListener('click', function () {
        period += 1;
        document.getElementById('period').textContent = period;
        determineWageOffer();
    });
</script>

<style>
    .table-container {
        float: right;
        margin-left: 20px;
        margin-top: 10px;
    }

    #history-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
    }

    #history-table th, #history-table td {
        padding: 10px;
        text-align: center;
        border: 2px solid #000;
    }

    #history-table th {
        background-color: #f2f2f2;
        font-weight: bold;
    }

    #history-table tbody tr:nth-child(even) {
        background-color: #f2f2f2;
    }

    #history-table tbody tr:nth-child(odd) {
        background-color: #ffffff;
    }

    #history-table tbody tr:hover {
        background-color: #e2e2e2;
    }
</style>
{% endblock %}
